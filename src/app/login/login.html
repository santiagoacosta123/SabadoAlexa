<div class="h-screen w-screen bg-[#e8e8e8] flex items-center justify-center p-8">

  <div class="w-full h-full bg-white rounded-xl shadow-xl overflow-hidden flex">

    <div class="w-1/2 flex-shrink-0 bg-white flex items-center justify-center px-10 py-5">
      <div class="w-full max-w-[400px] relative mx-auto my-auto">

        <div class="text-center mb-5">
          <img src="img/logo-sirae.png" alt="SiRAE" class="h-12 mx-auto mb-3 object-contain">
          <h1 class="text-3xl font-bold text-[#486333] mb-1 tracking-wide font-sans">Iniciar sesión</h1>
          <p class="text-[11px] text-gray-400">
            Organizamos la información para una<br>alimentación escolar más segura y eficiente.
          </p>
        </div>

        <form (ngSubmit)="iniciarSesion()" class="space-y-4">

          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Correo electrónico o usuario</label>
            <input
              type="text"
              name="correo"
              [(ngModel)]="login.correo"
              placeholder="Ingresa tu correo"
              class="w-full px-3 py-2.5 rounded-lg border border-[#7a9e67] text-sm text-gray-500 focus:outline-none focus:ring-1 focus:ring-[#486333] focus:border-[#7a9e67]"
            >
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Contraseña</label>
            <input
              type="password"
              name="password"
              [(ngModel)]="login.password"
              placeholder="Ingresa tu contraseña"
              class="w-full px-3 py-2.5 rounded-lg border border-[#7a9e67] text-sm text-gray-500 focus:outline-none focus:ring-1 focus:ring-[#486333] focus:border-[#7a9e67]"
            >
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Rol</label>
            <select
              name="rol"
              [(ngModel)]="login.rol"
              class="w-full px-3 py-2.5 rounded-lg border border-[#7a9e67] text-sm text-gray-400 bg-white focus:outline-none focus:ring-1 focus:ring-[#486333] focus:border-[#7a9e67]"
            >
              <option value="">Selecciona tu rol</option>
              <option value="administrador">Administrador</option>
              <option value="supervisor">Supervisor</option>
              <option value="manipuladora">Manipuladora</option>
              <option value="manipuladora-jefe">Manipuladora jefe</option>
            </select>
          </div>

          <div>
            <a routerLink="/recuperar-contrasena" class="text-[#486333] text-xs font-semibold hover:underline">
              ¿Olvidaste tu contraseña?
            </a>
          </div>

          <button
            type="submit"
            class="w-full bg-[#E8A317] hover:bg-[#d4941a] text-white font-bold py-2.5 rounded-full transition-colors text-sm"
          >
            Ingresar
          </button>

        </form>


        <div class="mt-5 text-center text-xs text-gray-400 space-y-0.5">
          <p>¿No tienes cuenta?</p>
          <a routerLink="/crear-cuenta" class="text-[#486333] font-bold hover:underline">
            Regístrate aquí
          </a>
        </div>

      </div>
    </div>

    <div class="w-1/2 relative overflow-hidden flex items-center justify-start pl-8 lg:pl-12 bg-white">
      <img src="img/vegetables-bg.jpg" alt="Vegetales" class="absolute inset-0 w-full h-full object-cover object-right">
      <div class="relative z-10">

        <img src="img/logo-sirae.png" alt="SiRAE" class="h-36 lg:h-40 max-w-[360px] object-contain">
      </div>
    </div>

  </div>

</div>
