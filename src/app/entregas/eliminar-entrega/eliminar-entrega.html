<div class="p-4 sm:p-6 lg:p-8">

  <div class="mx-auto max-w-lg">

    @if (entrega) {

      <!-- TARJETA DE CONFIRMACIÓN -->
      <div
        class="mt-10 w-full rounded-3xl border border-gray-200/80 bg-white p-8 text-center shadow-sm">

        <!-- ICONO -->
        <div
          class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full bg-red-50">

          <span class="text-3xl">
            ⚠️
          </span>

        </div>


        <!-- TITULO -->
        <h1
          class="text-3xl font-normal tracking-tight text-gray-900"
          style="font-family: serif;">

          Eliminar entrega

        </h1>

        <p class="mt-2 text-sm font-medium text-gray-500">

          ¿Estás seguro de que deseas eliminar esta entrega?

        </p>


        <!-- INFORMACIÓN -->
        <div
          class="mt-7 rounded-2xl border border-gray-200 bg-gray-50 p-5 text-left">

          <!-- DESTINO -->
          <div class="mb-4">

            <span
              class="text-xs font-bold uppercase tracking-wider text-gray-400">

              Destino

            </span>

            <p
              class="mt-1 font-semibold text-gray-900">

              {{ entrega.destino }}

            </p>

          </div>


          <!-- FECHA -->
          <div class="mb-4">

            <span
              class="text-xs font-bold uppercase tracking-wider text-gray-400">

              Fecha

            </span>

            <p
              class="mt-1 font-semibold text-gray-900">

              {{ entrega.fecha }}

            </p>

          </div>


          <!-- PRODUCTOS -->
          <div>

            <span
              class="text-xs font-bold uppercase tracking-wider text-gray-400">

              Productos

            </span>

            <p
              class="mt-1 font-semibold text-gray-900">

              {{ entrega.productos }}

            </p>

          </div>

        </div>


        <!-- BOTONES -->
        <div
          class="mt-7 flex flex-col-reverse gap-3 sm:flex-row sm:justify-center">

          <!-- CANCELAR -->
          <button
            type="button"
            (click)="cancelar()"
            class="rounded-xl border border-gray-200 bg-white px-5 py-3 font-semibold text-gray-600 transition hover:border-[#5f7435] hover:bg-[#f5f7ef] hover:text-[#5f7435]">

            Cancelar

          </button>


          <!-- ELIMINAR -->
          <button
            type="button"
            (click)="eliminar()"
            class="rounded-xl bg-red-600 px-5 py-3 font-semibold text-white shadow-sm transition hover:bg-red-700">

            Sí, eliminar

          </button>

        </div>

      </div>

    }

  </div>

</div>
