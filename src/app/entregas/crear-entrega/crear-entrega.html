<div class="p-4 sm:p-6 lg:p-8">

  <div class="mx-auto max-w-2xl">

    <!-- ENCABEZADO -->
    <div class="mb-8">

      <h1
        class="text-3xl font-normal tracking-tight text-gray-900"
        style="font-family: serif;">
        Nueva entrega
      </h1>

      <p class="mt-1 text-sm font-medium text-gray-500">
        Registra una nueva entrega
      </p>

    </div>


    <!-- FORMULARIO -->
    <div
      class="rounded-3xl border border-gray-200/80 bg-white p-6 shadow-sm sm:p-8">

      <form (ngSubmit)="guardar()">

        <!-- FECHA -->
        <div class="mb-6">

          <label
            class="mb-2 block text-sm font-semibold text-gray-700">

            Fecha

          </label>

          <input
            type="date"
            name="fecha"
            [(ngModel)]="fecha"
            required
            class="w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-gray-800 outline-none transition focus:border-[#5f7435] focus:ring-2 focus:ring-[#5f7435]/20">

        </div>


        <!-- DESTINO -->
        <div class="mb-6">

          <label
            class="mb-2 block text-sm font-semibold text-gray-700">

            Destino

          </label>

          <input
            type="text"
            name="destino"
            [(ngModel)]="destino"
            placeholder="Ingrese el destino"
            required
            class="w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-gray-800 outline-none transition placeholder:text-gray-400 focus:border-[#5f7435] focus:ring-2 focus:ring-[#5f7435]/20">

        </div>


        <!-- PRODUCTOS -->
        <div class="mb-6">

          <label
            class="mb-2 block text-sm font-semibold text-gray-700">

            Cantidad de productos

          </label>

          <input
            type="number"
            name="productos"
            [(ngModel)]="productos"
            min="1"
            required
            class="w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-gray-800 outline-none transition focus:border-[#5f7435] focus:ring-2 focus:ring-[#5f7435]/20">

        </div>


        <!-- ESTADO -->
        <div class="mb-8">

          <label
            class="mb-2 block text-sm font-semibold text-gray-700">

            Estado

          </label>

          <select
            name="estado"
            [(ngModel)]="estado"
            class="w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-gray-800 outline-none transition focus:border-[#5f7435] focus:ring-2 focus:ring-[#5f7435]/20">

            <option value="Pendiente">
              Pendiente
            </option>

            <option value="Completada">
              Completada
            </option>

            <option value="Cancelada">
              Cancelada
            </option>

          </select>

        </div>


        <!-- BOTONES -->
        <div
          class="flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">

          <!-- CANCELAR -->
          <button
            type="button"
            (click)="cancelar()"
            class="rounded-xl border border-gray-200 bg-white px-5 py-3 font-semibold text-gray-600 transition hover:border-[#5f7435] hover:bg-[#f5f7ef] hover:text-[#5f7435]">

            Cancelar

          </button>


          <!-- GUARDAR -->
          <button
            type="submit"
            class="rounded-xl bg-[#5f7435] px-5 py-3 font-semibold text-white shadow-sm transition hover:bg-[#4d5f2b]">

            Guardar entrega

          </button>

        </div>

      </form>

    </div>

  </div>

</div>
