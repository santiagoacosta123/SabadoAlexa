<div class="min-h-screen bg-gray-100 flex flex-col md:flex-row">

  <main class="flex-1">

    <header
      class="h-16 bg-white border-b flex items-center justify-end px-6">

      <div class="text-right">

        <p class="font-bold text-gray-800">
          Alejandra Ruiz
        </p>

        <p class="text-sm text-[#777777]">
          Administradora
        </p>

      </div>

    </header>


    <section class="p-4 md:p-6">

      <div class="bg-[#F4B41F] rounded-xl p-5 mb-6">

        <h2 class="text-2xl md:text-3xl font-bold text-white">
          Crear Categoría
        </h2>

        <p class="mt-2 text-white">
          Registra una nueva categoría para los productos del sistema.
        </p>

      </div>


      <div class="bg-white rounded-xl p-5 md:p-8 max-w-4xl mx-auto shadow-sm">

        <h3 class="text-xl font-bold mb-5 text-gray-800">
          Información de la categoría
        </h3>


        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

          <div>

            <label class="block font-semibold mb-2 text-[#777777]">
              Nombre de la categoría
            </label>

            <input
              type="text"
              [(ngModel)]="nombre"
              placeholder="Ej: Granos y Cereales"
              class="w-full border border-gray-300 rounded-lg p-3 outline-none focus:border-[#F4B41F]">

          </div>


          <div>

            <label class="block font-semibold mb-2 text-[#777777]">
              Estado
            </label>

            <select
              [(ngModel)]="estado"
              class="w-full border border-gray-300 rounded-lg p-3 outline-none focus:border-[#F4B41F]">

              <option value="Activo">
                Activo
              </option>

              <option value="Inactivo">
                Inactivo
              </option>

            </select>

          </div>


          <div class="md:col-span-2">

            <label class="block font-semibold mb-2 text-[#777777]">
              Descripción
            </label>

            <textarea
              [(ngModel)]="descripcion"
              placeholder="Escribe una descripción..."
              rows="4"
              class="w-full border border-gray-300 rounded-lg p-3 outline-none focus:border-[#F4B41F]"></textarea>

          </div>

        </div>


        <div class="mt-6">

          <h3 class="text-lg font-bold mb-3 text-gray-800">
            Categorías de alimentos
          </h3>


          <div class="flex gap-4 overflow-x-auto pb-3">

            <div
              class="min-w-[180px] bg-[#F4B41F]/10 rounded-xl p-4 text-center">

              <div class="text-5xl mb-2">
                
              </div>

              <p class="font-semibold text-gray-800">
                Granos
              </p>

            </div>


            <div
              class="min-w-[180px] bg-[#F4B41F]/10 rounded-xl p-4 text-center">

              <div class="text-5xl mb-2">
                
              </div>

              <p class="font-semibold text-gray-800">
                Lácteos
              </p>

            </div>


            <div
              class="min-w-[180px] bg-[#F4B41F]/10 rounded-xl p-4 text-center">

              <div class="text-5xl mb-2">
                
              </div>

              <p class="font-semibold text-gray-800">
                Proteínas
              </p>

            </div>


            <div
              class="min-w-[180px] bg-[#F4B41F]/10 rounded-xl p-4 text-center">

              <div class="text-5xl mb-2">
                
              </div>

              <p class="font-semibold text-gray-800">
                Frutas y Verduras
              </p>

            </div>

          </div>

        </div>


        <div class="flex flex-col sm:flex-row justify-end gap-3 mt-8">

          <button
            type="button"
            class="border border-gray-300 text-[#777777] px-5 py-3 rounded-lg hover:bg-gray-100"
            (click)="cancelar()">

            Cancelar

          </button>


          <button
            type="button"
            class="bg-[#F4B41F] text-white px-5 py-3 rounded-lg font-semibold hover:bg-[#d99d10]"
            (click)="crearCategoria()">

            Crear Categoría

          </button>

        </div>

      </div>

    </section>

  </main>

</div>
