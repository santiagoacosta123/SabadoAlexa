<div class="min-h-screen bg-gray-100 flex">

  <aside class="w-64 bg-white shadow-md flex flex-col">

    <div class="p-6 border-b">

      <h1 class="text-2xl font-bold text-[#F4B41F]">
        SIRAE
      </h1>

      <p class="text-sm text-[#777777]">
        Administrador
      </p>

    </div>


    <nav class="flex-1 p-4 space-y-2">

      <a class="block px-4 py-3 rounded-lg text-[#777777] hover:bg-gray-100">
        Inicio
      </a>

      <a class="block px-4 py-3 rounded-lg text-[#777777] hover:bg-gray-100">
        Usuarios
      </a>

      <a class="block px-4 py-3 rounded-lg bg-[#F4B41F]/10 text-[#F4B41F] font-bold">
        Categorías
      </a>

      <a class="block px-4 py-3 rounded-lg text-[#777777] hover:bg-gray-100">
        Productos
      </a>

      <a class="block px-4 py-3 rounded-lg text-[#777777] hover:bg-gray-100">
        Inventario
      </a>

    </nav>


    <div class="p-4 border-t">

      <button
        type="button"
        class="w-full py-2 rounded-lg bg-gray-100 text-[#777777]">

        Cerrar sesión

      </button>

    </div>

  </aside>


  <main class="flex-1">

    <header class="bg-white shadow-sm px-8 py-4 flex items-center justify-between">

      <div>

        <p class="text-sm text-[#777777]">
          Inicio / Categorías / Editar categoría
        </p>

        <h2 class="text-xl font-bold text-gray-800">
          Editar categoría
        </h2>

      </div>


      <div class="flex items-center gap-3">

        <button
          type="button"
          class="text-[#777777]">

          🔔

        </button>

        <div class="w-10 h-10 rounded-full bg-[#F4B41F] flex items-center justify-center text-white font-bold">
          A
        </div>

        <div>

          <p class="text-sm font-bold text-gray-800">
            Administrador
          </p>

          <p class="text-xs text-[#777777]">
            Administrador
          </p>

        </div>

      </div>

    </header>


    <section class="p-8">

      <div class="bg-[#F4B41F] rounded-xl p-5 mb-6">

        <h1 class="text-2xl font-bold text-white">
          Editar Categoría
        </h1>

        <p class="text-white/90 text-sm mt-1">
          Modifica la información de la categoría
        </p>

      </div>


      <div class="bg-white rounded-xl shadow-sm p-6">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">


          <div>

            <label class="block text-sm font-bold text-[#777777] mb-2">
              Nombre de la categoría
            </label>

            <input
              type="text"
              [(ngModel)]="categoria.nombre"
              placeholder="Ingrese el nombre"
              class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:border-[#F4B41F]">

          </div>


          <div>

            <label class="block text-sm font-bold text-[#777777] mb-2">
              Estado
            </label>

            <select
              [(ngModel)]="categoria.estado"
              class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:border-[#F4B41F]">

              <option value="Activo">
                Activo
              </option>

              <option value="Inactivo">
                Inactivo
              </option>

            </select>

          </div>


          <div class="md:col-span-2">

            <label class="block text-sm font-bold text-[#777777] mb-2">
              Descripción
            </label>

            <textarea
              [(ngModel)]="categoria.descripcion"
              rows="5"
              placeholder="Ingrese la descripción de la categoría"
              class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:border-[#F4B41F] resize-none"></textarea>

          </div>

        </div>


        <div class="flex justify-end gap-3 mt-8">

          <button
            type="button"
            (click)="cancelar()"
            class="px-6 py-3 rounded-lg bg-gray-200 text-[#777777] font-bold hover:bg-gray-300">

            Cancelar

          </button>


          <button
            type="button"
            (click)="actualizarCategoria()"
            class="px-6 py-3 rounded-lg bg-[#F4B41F] text-white font-bold hover:bg-[#d99d10]">

            Actualizar

          </button>

        </div>

      </div>

    </section>

  </main>

</div>
