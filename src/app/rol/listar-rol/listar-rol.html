<div class="p-6 md:p-8">

  <div class="flex items-center justify-between mb-8">

    <div>
      <h1 class="text-3xl font-bold text-gray-800">
        Roles
      </h1>

      <p class="text-gray-500 mt-1">
        Gestiona los roles de los usuarios
      </p>
    </div>

    <!-- NUEVO ROL -->
    <a
  routerLink="/roles/crear"
  class="bg-amber-400 hover:bg-amber-500 text-gray-900 font-bold px-5 py-3 rounded-lg transition"
>
  + Nuevo Rol
</a>

  </div>


  <div class="bg-white rounded-xl shadow-md border border-gray-200 overflow-hidden">

    <div class="overflow-x-auto">

      <table class="w-full">

        <thead class="bg-amber-400 hover:bg-amber-500">

          <tr>

            <th class="px-6 py-4 text-left text-gray-700 font-bold">
              Rol
            </th>

            <th class="px-6 py-4 text-left text-gray-700 font-bold">
              Usuario
            </th>

            <th class="px-6 py-4 text-left text-gray-700 font-bold">
              Estado
            </th>

            <th class="px-6 py-4 text-center text-gray-700 font-bold">
              Acciones
            </th>

          </tr>

        </thead>


        <tbody>

          @for (rol of roles; track rol.id_usuario) {

            <tr class="border-t border-gray-200 hover:bg-gray-50">

              <td class="px-6 py-4">

                <span class="font-semibold text-gray-800">
                  {{ rol.id_rol }}
                </span>

              </td>


              <td class="px-6 py-4">

                <div class="font-medium text-gray-800">
                  {{ rol.nombrecompleto }}
                </div>

                <div class="text-sm text-gray-500">
                  {{ rol.email }}
                </div>

              </td>


              <td class="px-6 py-4">

                @if (rol.estado) {

                  <span class="px-3 py-1 rounded-full bg-green-100 text-green-700 text-sm font-semibold">
                    Activo
                  </span>

                } @else {

                  <span class="px-3 py-1 rounded-full bg-red-100 text-red-700 text-sm font-semibold">
                    Inactivo
                  </span>

                }

              </td>


              <td class="px-6 py-4">

                <div class="flex justify-center gap-2">

                  <button
                    type="button"
                    (click)="ActualizarRoles(rol.id_usuario)"
                    class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg"
                  >
                    Actualizar
                  </button>

                  <button
                    type="button"
                    (click)="eliminarrol(rol.id_usuario)"
                    class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg"
                  >
                    Eliminar
                  </button>

                </div>

              </td>

            </tr>

          }

        </tbody>

      </table>

    </div>

  </div>

</div>
