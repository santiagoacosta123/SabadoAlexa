<div class="min-h-screen bg-gray-50 p-6 md:p-10">

  <div class="max-w-4xl mx-auto">

    <!-- Encabezado -->
    <div class="flex items-center gap-4 mb-8">

      <a
      routerLink="/rol"
      class="text-gray-600 hover:text-[#5f7435] transition"
      >
      <span class="text-3xl">←</span>
    </a>
      <div>
        <h1 class="text-3xl font-bold text-gray-800">
          Crear nuevo rol
        </h1>

        <p class="text-gray-500 mt-1">
          Completa la información para registrar un nuevo rol
        </p>
      </div>

    </div>

    <!-- Formulario -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200">

      <div class="p-6 md:p-8">

        <form (ngSubmit)="crearRoles()" class="space-y-6">

          <!-- Nombre -->
          <div>
            <label
              for="nombre_rol"
              class="block text-sm font-semibold text-gray-700 mb-2"
            >
              Nombre del rol
            </label>

            <input
              id="nombre_rol"
              type="text"
              name="nombre_rol"
              [(ngModel)]="roles.nombre_rol"
              placeholder="Ejemplo: Administrador"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg
                     outline-none focus:ring-2 focus:ring-amber-400
                     focus:border-amber-400"
            >
          </div>

          <!-- Descripción -->
          <div>
            <label
              for="descripcion"
              class="block text-sm font-semibold text-gray-700 mb-2"
            >
              Descripción
            </label>

            <textarea
              id="descripcion"
              name="descripcion"
              [(ngModel)]="roles.descripcion"
              rows="5"
              placeholder="Escribe una descripción para este rol..."
              class="w-full px-4 py-3 border border-gray-300 rounded-lg
                     outline-none resize-none focus:ring-2
                     focus:ring-amber-400 focus:border-amber-400"
            ></textarea>
          </div>

          <!-- Estado -->
          <div
            class="flex items-center justify-between p-4 rounded-lg
                   bg-gray-50 border border-gray-200"
          >

            <div>
              <p class="font-semibold text-gray-800">
                Estado del rol
              </p>

              <p class="text-sm text-gray-500">
                Activa o desactiva este rol
              </p>
            </div>

            <label class="relative inline-flex items-center cursor-pointer">

              <input
                type="checkbox"
                name="estado"
                [(ngModel)]="roles.estado"
                class="sr-only peer"
              >

              <div
                class="w-11 h-6 bg-gray-300 rounded-full
                       peer peer-checked:bg-amber-400 transition"
              ></div>

              <div
                class="absolute left-1 top-1 w-4 h-4 bg-white
                       rounded-full transition peer-checked:translate-x-5"
              ></div>

            </label>

          </div>

          <!-- Botones -->
          <div
            class="flex justify-end gap-3 pt-6
            border-t border-gray-200"
          >

<a
  routerLink="/rol"
  class="px-6 py-3 rounded-lg
        border border-gray-300
        text-gray-700 font-semibold
        hover:bg-gray-100 transition"
>
  Cancelar
</a>





            <button
              type="submit"
              class="px-6 py-3 rounded-lg
                    bg-amber-400 hover:bg-amber-500
                    text-gray-900 font-bold transition"
            >
              Crear rol
            </button>

          </div>

        </form>

      </div>

    </div>

  </div>

</div>
